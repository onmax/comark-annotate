packages:
  - "packages/*"
  - "docs"

catalogMode: prefer

# @vite-hub/content comes from pkg.pr.new, whose packages depend on each other by URL, and pnpm has no per-package allowance.
blockExoticSubdeps: false

catalog:
  "@fontsource-variable/caveat": ^5.3.0
  "@iconify-json/lucide": ^1.2.100
  "@iconify/types": ^2.0.0
  "@iconify/utils": ^3.1.7
  "@playwright/test": ^1.64.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@comark/react": ^0.8.1
  "@comark/svelte": ^0.8.1
  "@comark/vue": ^0.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  svelte: ^5.57.2
  vue: ^3.5.44
  "@comark/html": ^0.8.1
  comark: ^0.8.1
  flint-chart: ^0.5.1
  vega: ^6.4.0
  vega-interpreter: ^2.3.2
  vega-lite: ^6.5.0
  geist: ^1.7.2
  pkg-pr-new: ^0.0.91
  publint: ^0.3.25
  shiki: ^4.5.0
  tsdown: ^0.23.1
  typescript: ^6.0.3
  vite-doctor: ^0.1.0
  "@types/node": ^24.0.0
  vite: npm:@voidzero-dev/vite-plus-core@^1.1.0
  vite-plus: ^1.1.0

overrides:
  vite: "catalog:"
  # comark-content 0.4.1 asks for comark ^0.7, and the plugins need 0.8's parser.
  "comark-content>comark": "catalog:"

minimumReleaseAgeExclude:
  - vite-doctor@0.1.0
  - "@comark/html@0.8.1"
  - "@comark/react@0.8.1"
  - "@comark/vue@0.8.1"
  - comark@0.8.1

allowBuilds:
  esbuild: false
  msgpackr-extract: true
