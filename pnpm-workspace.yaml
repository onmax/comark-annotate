packages:
  - "packages/*"
  - "docs"

catalogMode: prefer

# @vite-hub/content comes from pkg.pr.new, whose packages depend on each other by URL, and pnpm has no per-package allowance.
blockExoticSubdeps: false

catalog:
  "@playwright/test": ^1.64.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@comark/react": ^0.7.0
  "@comark/svelte": ^0.7.0
  "@comark/vue": ^0.7.0
  react: ^19.3.1
  react-dom: ^19.3.1
  svelte: ^5.57.2
  vue: ^3.5.44
  "@comark/html": ^0.7.0
  comark: ^0.7.0
  flint-chart: ^0.5.1
  vega: ^6.4.0
  vega-interpreter: ^2.3.2
  vega-lite: ^6.5.0
  geist: ^1.7.2
  pkg-pr-new: ^0.0.91
  publint: ^0.3.25
  shiki: ^4.5.0
  tsdown: ^0.23.1
  typescript: ^6.0.3
  vite-doctor: ^0.1.0
  "@types/node": ^24.0.0
  vite: npm:@voidzero-dev/vite-plus-core@^1.1.0
  vite-plus: ^1.1.0

overrides:
  vite: "catalog:"

minimumReleaseAgeExclude:
  - vite-doctor@0.1.0
  - "@nuxt/kit-nightly@5.0.0-2610192007-fe9ca5b"
  - "@nuxt/nitro-server-nightly@5.0.0-2610192007-fe9ca5b"
  - "@nuxt/schema-nightly@5.0.0-2610192007-fe9ca5b"
  - "@nuxt/vite-builder-nightly@5.0.0-2610192007-fe9ca5b"
  - "@nuxt/vite-server-nightly@5.0.0-2610192007-fe9ca5b"
  - nuxt-nightly@5.0.0-2610192007-fe9ca5b

allowBuilds:
  esbuild: false
